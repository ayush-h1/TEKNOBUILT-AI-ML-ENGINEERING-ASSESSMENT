# Tunable thresholds.
#
# IMPORTANT: every value below was chosen on SYNTHETIC test images only. No threshold has
# been validated on real scanned forms, and none supports any claim about real-world
# accuracy. They must be re-tuned on the real scanned PDF once it is available.
#
# This file lists the configurable settings only. Other constants are fixed in the code
# (blur kernel size, percentile choices, filter kernels, what counts as "uniform white" or a
# "zero-filled" row); they are documented in quality.py and ingest.py.

ingest:
  render_dpi: 200            # resolution used to rasterise each PDF page
  max_pixels: 40000000       # refuse to render pages larger than this (memory guard)
  # A run of full-width, pure-black rows (every pixel <= 2) covering at least this share of
  # the page height is treated as zero-filled data from a truncated or damaged image stream.
  # Real scans carry sensor noise, so exact-black full rows do not occur naturally.
  min_zero_band_ratio: 0.02

quality:
  # Pixels darker than this fraction of the local background count as "ink".
  ink_relative_threshold: 0.6
  # Pixels darker than this fraction count as a (possibly faint) "mark". Must be above
  # ink_relative_threshold. Faded or blurred writing still registers as marks.
  mark_relative_threshold: 0.93
  # A group of marked pixels is page content (a stroke, a ruled line, a letter) when its
  # longest side is at least this fraction of the page's longer side. Smaller groups are
  # treated as dust/speckle. A page with no content is a candidate for "blank".
  min_content_extent_ratio: 0.006
  # A page with no content is only called blank when its median grey level is at least
  # this. A uniformly grey or dark scan is "unreadable", not "blank".
  min_blank_paper_level: 170
  # Above this ink fraction the page is mostly dark: mud, heavy stains, black scan.
  max_ink_ratio: 0.45
  # Mean grey level (0-255). Below this the scan is too dark to trust.
  min_mean_brightness: 90
  # Paper level minus the 10th percentile grey of content pixels. Below this: low contrast.
  min_contrast: 40
  # Variance of the Laplacian around content, on a width-normalised copy. Below this the
  # page is out of focus.
  min_sharpness: 40
  # Width used to normalise the image before measuring sharpness.
  sharpness_reference_width: 1000
  # Gaussian-noise standard deviation (grey levels) above which the page is too noisy.
  max_noise_sigma: 15.0
  # Salt-and-pepper detection: a pixel counts as a speckle when it differs from its 3x3
  # median by at least this many grey levels AND none of its 8 neighbours does (isolated
  # impulse; connected deviations such as thin lines are not counted). The page is too
  # noisy when the share of speckle pixels exceeds max_speckle_ratio.
  speckle_min_difference: 60
  max_speckle_ratio: 0.005

# Registration of each page to template.png. All values below are starting values chosen from one
# supplied sample and from labelled synthetic cases. None is validated on real scans.
alignment:
  # SIFT with an affine fit is the primary method. Homography is tried only when the affine fit
  # fails verification and the homography is clearly better. ORB is an opt-in alternative: add
  # "orb" to this list to enable it; it is never added automatically and must pass stricter
  # verification (orb_strictness). Neither detector can force an alignment to be accepted.
  detectors: [sift]
  max_features: 4000
  ratio_test: 0.75
  ransac_threshold_px: 4.0         # in template pixels
  ransac_max_iters: 5000
  ransac_confidence: 0.999
  rng_seed: 0                      # OpenCV's affine RANSAC was repeatable without it; kept as a guard
  # Gates. All must pass, otherwise the page is not aligned and nothing is extracted from it.
  min_matches: 12
  min_inliers: 12
  min_inlier_spread: 0.35          # inliers must cover this share of the template width and height
  max_median_residual_px: 2.5
  min_scale: 0.2
  max_scale: 5.0
  max_shear_degrees: 30.0          # loose on purpose: rotating an anisotropically stretched page shears it
  max_perspective: 0.25
  # Independent check: the warped page's lines must agree with the template's own lines.
  verification_max_mean_px: 1.5
  verification_min_within_2px: 0.90
  orb_strictness: 0.5
  allow_homography: true
  homography_min_improvement_px: 0.25

# Reading cells in the aligned template frame. Starting values from the supplied sample (marked
# boxes held 82-112 dark pixels, about 1.1-1.5% of a cell; every empty box held 0) and synthetic cases.
extraction:
  dark_ratio: 0.55                     # ink = darker than this share of the paper level
  line_tolerance_px: 2                 # ink within this distance of a ruled line belongs to the line
  checkbox_empty_max_fraction: 0.002   # at most this share of the box inked -> unchecked
  checkbox_checked_min_fraction: 0.005 # at least this -> checked; anything in between -> uncertain
  checkbox_checked_max_fraction: 0.08  # more than this (scribble, filled box) -> uncertain
  min_text_ink_px: 25                  # fewer dark pixels in a text cell -> empty
  row_rule_min_coverage: 0.8           # a checklist row exists only where its grid lines are drawn
  orphan_ink_min_px: 50                # ink in a slot without a grid -> page review

# Text recognition. Handwritten text is always a candidate that needs human confirmation,
# whatever the engine's confidence; only printed text can be accepted automatically.
ocr:
  tesseract_cmd: null              # null = auto-locate (config, TESSERACT_CMD, PATH, default install path)
  language: eng
  upscale: 2.0
  printed_min_confidence: 0.80
  printed_provider: auto           # auto | tesseract | none
  handwritten_provider: auto
